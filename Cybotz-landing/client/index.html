    <!-- JSON-LD Structured Data: Organization + Services -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Cybotz",
      "url": "https://cybotz.tech",
      "logo": "https://cybotz.tech/logos/cybotz_logo.png",
      "description": "Cybotz empowers young minds with real-world STEM skills through hands-on Drone, Electronics, and Robotics training for schools in Bangalore. We focus on core engineering fundamentals — no AI shortcuts, no play-kits, no pre-packaged templates. Students learn by building, soldering, coding, and flying real hardware from scratch. Schools choose Cybotz because our programs develop genuine technical thinkers who understand raw engineering, not just button-pushers. With 400+ students mentored across leading Bangalore schools including Canadian International School, Mallya Aditi International School, Christ University, and more — Cybotz delivers intensive workshops and permanent lab setups that transform classrooms into real engineering environments.",
      "founder": {
        "@type": "Person",
        "name": "Prasanna",
        "jobTitle": "Founder & FPV Drone Pilot"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "3rd cross, Garden Street Extension",
        "addressLocality": "Bangalore",
        "postalCode": "560016",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-7349045770",
        "email": "info@cybotz.tech",
        "contactType": "customer service"
      },
      "sameAs": [
        "https://linkedin.com/company/cybotz",
        "https://www.instagram.com/cybotz.experience"
      ],
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "STEM Programs",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Course",
              "name": "Drone Building Workshop",
              "description": "Hands-on drone assembly, flight mechanics, FPV piloting, and telemetry — students build and fly their own quadcopter."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Course",
              "name": "Robotics & Electronics Workshop",
              "description": "From circuit fundamentals to programming microcontrollers and building autonomous robots from raw components."
            }
          },
          {
            "@type": "Offer",
            "itemOffered": {
              "@type": "Course",
              "name": "Permanent STEM Lab Setup",
              "description": "Full lab infrastructure, curriculum design, teacher training, and ongoing technical support for schools."
            }
          }
        ]
      }
    }
