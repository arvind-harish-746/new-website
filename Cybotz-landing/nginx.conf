server {
    listen 80;
    server_name cybotz.tech www.cybotz.tech;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cybotz.tech www.cybotz.tech;

    # ---------------------
    # SSL (Let's Encrypt / Certbot)
    # ---------------------
    ssl_certificate     /etc/letsencrypt/live/cybotz.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cybotz.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (1 year, include subdomains, preload-ready)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ---------------------
    # Performance
    # ---------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Client body size (for image uploads via admin portal)
    client_max_body_size 50M;

    # ---------------------
    # Reverse Proxy → Express (port 5000)
    # ---------------------
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed in future)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    90s;
        proxy_send_timeout    90s;
    }

    # ---------------------
    # Static asset caching (JS/CSS have content hashes in filenames)
    # ---------------------
    location ~* \.(js|css|woff2|woff|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Image and media caching
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|mp4|glb|gltf)$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---------------------
    # Security: block dotfiles (except .well-known for Certbot)
    # ---------------------
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
