services:
  mongodb:
    image: mongo:7.0
    container_name: cybotz-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secretpassword
      - MONGO_INITDB_DATABASE=cybotz

  redis:
    image: redis:alpine
    container_name: cybotz-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  mongodb_data:
